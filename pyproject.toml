[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-prover"
version = "0.1.0"
description = "Agent that writes and iterates Lean 4 proofs"
requires-python = ">=3.10"
dependencies = ["openai>=1.30", "pydantic>=2.0"]

[project.optional-dependencies]
tui = ["textual>=0.80", "pyperclip"]
test = ["pytest>=8.0"]
all = ["textual>=0.80", "pyperclip", "pytest>=8.0"]

[project.scripts]
prover = "agent.main:cli"

[tool.setuptools.packages.find]
include = ["agent*"]
